services:
  pi-tree:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3847}:${PORT:-3847}"
    env_file:
      - .env
      - .env.docker
    volumes:
      # Bind mount — data persists across rebuilds on the host filesystem.
      # Set PI_TREE_DATA in .env to your data directory (default: ./data).
      - ${PI_TREE_DATA:-./data}:/data
      # Skill files are read from disk at each session start, so mounting them
      # lets you iterate on SKILL.md with `docker compose restart pi-tree`
      # instead of a full `--build`. (Core/server .ts changes still need --build.)
      - ./packages/plugin-news/skills:/app/packages/plugin-news/skills:ro
      - ./packages/plugin-book/skills:/app/packages/plugin-book/skills:ro
      - ./packages/plugin-paper/skills:/app/packages/plugin-paper/skills:ro
      - ./packages/plugin-youtube/skills:/app/packages/plugin-youtube/skills:ro
    environment:
      - DATA_PATH=/data
    extra_hosts:
      # Enables host.docker.internal on Linux (built-in on macOS/Windows).
      # Required for local model servers (e.g., LM Studio) running on the host.
      - "host.docker.internal:host-gateway"
