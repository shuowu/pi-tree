name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Layer 1: Build & type safety
      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Layer 2: Unit + API smoke tests
      - name: Test
        run: npm test
        env:
          DATA_PATH: /tmp/pi-books-ci
          LIBRARY_PATH: /tmp/pi-books-ci-library

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pi-books:ci .
