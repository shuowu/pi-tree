name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      # Layer 1: Build & type safety
      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Layer 2: Unit + API smoke tests
      #   --reporter=verbose prevents vitest's auto github-actions reporter
      #   from writing 4 identical "Vitest Test Report" headings
      - name: Unit tests
        run: |
          echo "## 🧪 Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for pkg in core server client ui; do
            echo "::group::@pi-tree/$pkg"
            if npm test --workspace=packages/$pkg -- --reporter=verbose 2>&1; then
              echo "✅ **@pi-tree/$pkg** — passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **@pi-tree/$pkg** — failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          DATA_PATH: /tmp/pi-tree-ci
          LIBRARY_PATH: /tmp/pi-tree-ci-library

      # Layer 3: Playwright E2E (Dev Services)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e
        run: npm run e2e -- --project=chromium --reporter=html

      - name: E2E summary
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.e2e.outcome }}" = "success" ]; then
            echo "✅ **E2E (Playwright)** — passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **E2E (Playwright)** — failed (see [report artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t pi-tree:ci .

      # Spin up the container and verify it actually works
      - name: Start container
        run: |
          mkdir -p /tmp/ci-library
          docker run -d --name pi-tree-ci \
            -p 3847:3847 \
            -v /tmp/ci-library:/library:ro \
            -e LIBRARY_PATH=/library \
            -e DATA_PATH=/data \
            pi-tree:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3847/health; then
              echo ""
              echo "✓ Server is healthy"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "✗ Server failed to start"
          docker logs pi-tree-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          # Health check
          curl -sf http://localhost:3847/health | grep '"status":"ok"'
          echo "✓ /health"

          # API responds
          curl -sf http://localhost:3847/api/users | grep '"users"'
          echo "✓ /api/users"

          curl -sf http://localhost:3847/api/library/sources | grep '"sources"'
          echo "✓ /api/library/sources"

          curl -sf http://localhost:3847/api/config | grep '"readingModel"'
          echo "✓ /api/config"

          # Frontend loads (production static serving)
          curl -sf http://localhost:3847/ | grep '</html>'
          echo "✓ Frontend HTML served"

      # Layer 4: Playwright E2E Smoke Test (piggyback on running container)
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        env:
          BASE_URL: http://localhost:3847

      - name: Dump logs on failure
        if: failure()
        run: docker logs pi-tree-ci

      - name: Cleanup
        if: always()
        run: docker rm -f pi-tree-ci 2>/dev/null || true
